name: Generate GitHub Pet

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pet-light.svg
            dist/pet.svg?palette=github-dark

      - name: Commit and Push the generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub pet status"
          branch: main
          file_pattern: 'dist/*.svg'

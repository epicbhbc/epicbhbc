name: Generate GitHub Pet

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # This is the corrected, real action repository
      - name: Generate Pet SVGs
        uses: prsdx/github-pet@main 
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_dir: dist 

      - name: Commit and Push the generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub pet status"
          branch: main
          file_pattern: 'dist/*.svg'
